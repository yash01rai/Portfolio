function useReveal(rootMargin = "-80px") {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) { el.classList.add("visible"); obs.disconnect(); } },
      { rootMargin }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return ref;
}

        </div>
        <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", gap: 24, flexWrap: "wrap" }}>

            <h2 style={{ fontSize: "clamp(32px, 5vw, 56px)", color: "var(--text)", letterSpacing: "-0.02em", lineHeight: 1.1, marginBottom: 12 }}>

              <PostCard key={i} post={post} highlighted={true} delay={0} />
            ))}
          </div>
        )}

        {/* Feed grid */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(340px, 1fr))", gap: 16 }}>
          {(platform === "All"
            ? [...(FEED_POSTS["LinkedIn"] || []).map(p => ({...p, _src:"linkedin"})), ...(FEED_POSTS["X / Twitter"] || []).map(p => ({...p, _src:"x"}))]
                .sort(() => 0) // preserve interleaved order — just concat
            : (FEED_POSTS[platform] || [])
          ).map((post, i) => (
            <PostCard key={`${platform}-${i}`} post={post} delay={i * 0.06} />
          ))}
        </div>

        {/* Load more */}
        <div style={{ marginTop: 32, display: "flex", justifyContent: "center" }}>
          <button className="grad-btn">
            <span className="grad-btn-inner">View all posts on {platform} <span style={{ opacity: 0.5 }}>→</span></span>
          </button>
        </div>
      </div>
    </section>
  );
}
